name: asterisk-pn
version: 1.0.7
summary: Asterisk softphone push notifier (asterisk-push-notify)
description: |
  Acordador de softphone VoIP (push APNs/FCM) para o Asterisk.
  O dialplan chama `asterisk-pn` para checar (SIP OPTIONS) se o app do
  celular está vivo e, se não estiver, enviar o push para acordá-lo.

  Nome descritivo: asterisk-push-notify.
architectures:
- amd64
base: core22
apps:
  asterisk-pn:
    command: bin/asterisk-pn
confinement: classic
grade: stable
